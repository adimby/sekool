# FANABE demo — Render Blueprint
# Dashboard : New → Blueprint → ce dépôt, branche cursor/appel-cours-college-3345
# Docs : https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: fanabe
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: fanabe-db
          property: connectionString

databases:
  - name: fanabe-db
    postgresMajorVersion: "16"
    ipAllowList: []
