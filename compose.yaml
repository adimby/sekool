services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fanabe
      POSTGRES_USER: fanabe
      POSTGRES_PASSWORD: fanabe
    ports:
      - "5432:5432"
    volumes:
      - fanabe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanabe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fanabe
      MINIO_ROOT_PASSWORD: fanabes3pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fanabe_minio:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  fanabe_pg:
  fanabe_minio:
