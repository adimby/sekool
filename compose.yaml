# Infra interne (aucun port hôte).
# Dev local     : make up     → compose.dev.yaml publie 5432, MinIO, Mailpit
# Démo sur VPS  : make vps    → service `app` (HTTP), Postgres non exposé
#
# Redis n'est PAS publié sur 6379 : un Redis hôte (fréquent sur un VPS)
# occupe déjà ce port. La démo phase 1 n'en a pas besoin (cache fichier).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fanabe
      POSTGRES_USER: fanabe
      POSTGRES_PASSWORD: fanabe
    volumes:
      - fanabe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanabe"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fanabe
      MINIO_ROOT_PASSWORD: fanabes3pass
    volumes:
      - fanabe_minio:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

  app:
    profiles: ["vps"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FANABE_HTTP_PORT:-80}:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DATABASE_URL: postgres://fanabe:fanabe@db:5432/fanabe
      DB_SSLMODE: disable
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      HASH_DRIVER: bcrypt
      LOG_CHANNEL: stderr
    volumes:
      - fanabe_keys:/var/fanabe-keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fanabe_pg:
  fanabe_minio:
  fanabe_keys:
